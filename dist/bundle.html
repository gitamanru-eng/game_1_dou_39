<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Создай своего человека</title><style>*{box-sizing:border-box;font-family:'Segoe UI',Roboto,system-ui,sans-serif;margin:0;padding:0}body{background:linear-gradient(145deg,#dbe5f0 0%,#c2d1e2 100%);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}.game-container{max-width:1150px;width:100%;background:rgba(255,255,255,0.4);backdrop-filter:blur(8px);border-radius:56px;box-shadow:0 25px 45px -12px rgba(0,0,0,0.4),inset 2px 2px 5px rgba(255,255,255,0.6);padding:30px}.creator{display:flex;flex-wrap:wrap;gap:24px}.canvas-area{flex:1 1 400px;min-width:320px;background:#dee9f2;border-radius:42px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.7),0 12px 18px -8px rgba(0,20,40,0.3);padding:30px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center}.canvas-title{font-size:1.2rem;font-weight:600;color:#2a3d4f;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,240,0.5);padding:6px 18px;border-radius:40px;backdrop-filter:blur(2px);margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,0.05)}.face-canvas{display:block;width:auto;max-width:360px;max-height:calc(100vh - 220px);height:auto;aspect-ratio:400 / 800;background:#cfdbe8;border-radius:48px;box-shadow:0 10px 20px -5px rgba(30,40,60,0.3),inset 0 -2px 5px #b0c1d2;cursor:pointer;transition:transform 0.1s ease;border:3px solid #f0f6fe}.face-canvas:active{transform:scale(0.99)}.canvas-hint{margin-top:12px;font-size:0.85rem;opacity:0.7}.controls-panel{flex:1 1 320px;background:rgba(245,240,245,0.7);backdrop-filter:blur(16px);border-radius:48px;padding:28px 22px;box-shadow:0 16px 32px -10px #5f6f7e,inset 2px 2px 8px #fdfdff;display:flex;flex-direction:column;gap:20px}.random-row{display:flex;justify-content:flex-end;margin-bottom:8px}@media (min-width:768px){.game-container{height:calc(100vh - 40px);max-height:calc(100vh - 40px);overflow:hidden}.creator{height:100%;display:flex;flex-direction:row;align-items:stretch}.controls-panel{height:100%;min-height:0;max-height:100%;overflow-y:auto}}.random-btn{background:#ffffffde;border:none;border-radius:50px;padding:12px 28px;font-size:1.2rem;font-weight:600;color:#153b50;box-shadow:0 4px 8px rgba(0,10,20,0.2),0 0 0 2px #f2f9ff;backdrop-filter:blur(4px);cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:all 0.15s}.random-btn:hover{background:#fff;box-shadow:0 8px 14px #1d3a4e4d,0 0 0 3px #c0d3e9;transform:scale(1.02)}.random-btn:active{transform:scale(0.96)}.control-section{background:#dee9f2cc;border-radius:34px;padding:20px 20px 18px;box-shadow:inset 0 1px 4px #f6fbff,0 6px 12px #8195a6}.section-title{font-size:1rem;font-weight:600;color:#1a3b4e;letter-spacing:0.7px;margin-bottom:16px;padding-left:8px;display:flex;align-items:center;gap:8px}.section-title span{font-size:1.3rem}.option-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start}.opt-btn{background:#f2f8ff;border:2px solid #b7cddf;border-radius:34px;padding:8px 18px;font-size:0.95rem;font-weight:550;color:#1f3c4f;box-shadow:0 2px 5px #0000001a;cursor:pointer;transition:0.1s;flex:0 1 auto;backdrop-filter:blur(2px)}.opt-btn.selected{background:#1c3f5c;border-color:#ffffff;color:white;box-shadow:0 0 0 3px #fffaec,0 5px 10px black;transform:scale(1.02)}.color-options{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-left:8px}.color-dot{width:46px;height:46px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px #1f3b4e;cursor:pointer;transition:0.1s}.color-dot.selected{transform:scale(1.15);border:4px solid #fbd24d;box-shadow:0 0 0 3px #305d81}.color-dot.beige{background:#f5e6d3}.color-dot.olive{background:#d6b57c}.color-dot.brown{background:#a3775a}.color-dot.darkbrown{background:#6e4f3a}.color-dot.almond{background:#f3d9c1}.footer-note{color:#1d3a47;margin-top:10px;font-size:0.9rem;opacity:0.8;text-align:right}</style></head><body><div class="game-container"><div class="creator"><div class="canvas-area"><div class="canvas-title">✧ твой человек ✧</div><canvas id="faceCanvas" class="face-canvas" width="400" height="800"></canvas><div class="canvas-hint">▼ кликни для случайного</div></div><div class="controls-panel"><div class="random-row"><button class="random-btn" id="randomAllBtn">🎲 Случайный набор</button></div><div class="control-section"><div class="section-title"><span>🔮</span> Форма лица</div><div class="option-grid" id="faceShapeGroup"><button class="opt-btn" data-shape="round">Круглое</button><button class="opt-btn selected" data-shape="oval">Овальное</button></div></div><div class="control-section"><div class="section-title"><span>🎨</span> Цвет кожи</div><div class="color-options" id="skinColorGroup"><div class="color-dot beige" data-skin="beige" title="светлый"></div><div class="color-dot olive selected" data-skin="olive" title="оливковый"></div><div class="color-dot brown" data-skin="brown" title="средний"></div><div class="color-dot darkbrown" data-skin="darkbrown" title="тёмный"></div><div class="color-dot almond" data-skin="almond" title="миндальный"></div></div></div><div class="control-section"><div class="section-title"><span>👂</span> Уши</div><div class="option-grid" id="earsGroup"><button class="opt-btn selected" data-ears="normal">Обычные</button><button class="opt-btn" data-ears="small">Маленькие</button><button class="opt-btn" data-ears="big">Большие</button><button class="opt-btn" data-ears="elf">Эльфийские</button></div></div><div class="control-section"><div class="section-title"><span>💇</span> Волосы</div><div class="option-grid" id="hairGroup"><button class="opt-btn" data-hair="none">Лысина</button><button class="opt-btn selected" data-hair="short">Короткие</button><button class="opt-btn" data-hair="mohawk">Ирокез</button></div></div><div class="control-section"><div class="section-title"><span>🧔</span> Борода</div><div class="option-grid" id="beardGroup"><button class="opt-btn selected" data-beard="none">Нет</button><button class="opt-btn" data-beard="stubble">Щетина</button><button class="opt-btn" data-beard="goatee">Эспаньолка</button><button class="opt-btn" data-beard="full">Полная</button><button class="opt-btn" data-beard="long">Длинная</button></div></div><div class="control-section"><div class="section-title"><span>👀</span> Глаза</div><div class="option-grid" id="eyesGroup"><button class="opt-btn selected" data-eyes="round">Круглые</button><button class="opt-btn" data-eyes="happy">Весёлые</button><button class="opt-btn" data-eyes="angry">Сердитые</button></div></div><div class="control-section"><div class="section-title"><span>✏️</span> Брови</div><div class="option-grid" id="browsGroup"><button class="opt-btn selected" data-brows="neutral">Прямые</button><button class="opt-btn" data-brows="arched">Дугообразные</button><button class="opt-btn" data-brows="fierce">Суровые</button><button class="opt-btn" data-brows="surprised">Удивлённые</button></div></div><div class="control-section"><div class="section-title"><span>👕</span> Одежда</div><div class="option-grid" id="clothesGroup"><button class="opt-btn selected" data-clothes="tshirt">Футболка</button><button class="opt-btn" data-clothes="hoodie">Худи</button><button class="opt-btn" data-clothes="suit">Костюм</button><button class="opt-btn" data-clothes="jacket">Куртка</button></div></div><div class="control-section"><div class="section-title"><span>🎨</span> Цвет одежды</div><div class="color-options" id="clothesColorGroup"><div class="color-dot selected" style="background:#4a7fc1" data-clothescolor="blue" title="синий"></div><div class="color-dot" style="background:#c14a4a" data-clothescolor="red" title="красный"></div><div class="color-dot" style="background:#4ac15b" data-clothescolor="green" title="зелёный"></div><div class="color-dot" style="background:#2e2e2e" data-clothescolor="black" title="чёрный"></div><div class="color-dot" style="background:#c8a84b" data-clothescolor="yellow" title="жёлтый"></div><div class="color-dot" style="background:#c0c0c0" data-clothescolor="gray" title="серый"></div></div></div><div class="control-section"><div class="section-title"><span>👖</span> Цвет штанов</div><div class="color-options" id="pantsColorGroup"><div class="color-dot selected" style="background:#4a7fc1" data-pantscolor="blue" title="синий"></div><div class="color-dot" style="background:#c14a4a" data-pantscolor="red" title="красный"></div><div class="color-dot" style="background:#4ac15b" data-pantscolor="green" title="зелёный"></div><div class="color-dot" style="background:#2e2e2e" data-pantscolor="black" title="чёрный"></div><div class="color-dot" style="background:#c8a84b" data-pantscolor="yellow" title="жёлтый"></div><div class="color-dot" style="background:#c0c0c0" data-pantscolor="gray" title="серый"></div></div></div><div class="control-section"><div class="section-title"><span>👞</span> Обувь</div><div class="option-grid" id="shoesGroup"><button class="opt-btn selected" data-shoes="sneakers">Кеды</button><button class="opt-btn" data-shoes="boots">Ботинки</button><button class="opt-btn" data-shoes="loafers">Лоферы</button></div></div><div class="control-section"><div class="section-title"><span>👄</span> Рот</div><div class="option-grid" id="mouthGroup"><button class="opt-btn selected" data-mouth="smile">Улыбка</button><button class="opt-btn" data-mouth="neutral">Нейтральный</button><button class="opt-btn" data-mouth="sad">Грустный</button><button class="opt-btn" data-mouth="open">Приоткрыт</button></div></div><div class="footer-note">«Сохраняй» — образ готов ✨</div></div></div></div><script>const defaultState = {
faceShape: 'oval',
skinColor: 'olive',
ears: 'normal',
hair: 'short',
beard: 'none',
eyes: 'round',
brows: 'neutral',
mouth: 'smile',
clothes: 'tshirt',
clothesColor: 'blue',
pantsColor: 'blue',
shoes: 'sneakers'
};
const skinColorMap = {
beige: '#F5E6D3',
olive: '#D6B57C',
brown: '#A3775A',
darkbrown: '#6E4F3A',
almond: '#F3D9C1'
};
const randomOptions = {
faceShape: ['round', 'oval'],
skinColor: ['beige', 'olive', 'brown', 'darkbrown', 'almond'],
ears: ['normal', 'small', 'big', 'elf'],
hair: ['none', 'short', 'mohawk'],
beard: ['none', 'stubble', 'goatee', 'full', 'long'],
eyes: ['round', 'happy', 'angry'],
brows: ['neutral', 'arched', 'fierce', 'surprised'],
mouth: ['smile', 'neutral', 'sad', 'open'],
clothes: ['tshirt', 'hoodie', 'suit', 'jacket'],
clothesColor: ['blue', 'red', 'green', 'black', 'yellow', 'gray'],
pantsColor: ['blue', 'red', 'green', 'black', 'yellow', 'gray'],
shoes: ['sneakers', 'boots', 'loafers']
};
function pickRandomOption(optionList) {
return optionList[Math.floor(Math.random() * optionList.length)];
}
const DEFAULT_SKIN = '#D6B57C';
class CanvasRenderer {
constructor(canvas) {
if (!canvas) {
throw new Error('Canvas element missing');
}
this.canvas = canvas;
this.ctx = canvas.getContext('2d');
}
render(state) {
const ctx = this.ctx;
ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
this.drawBody(state);
this.drawHeadShape(state);
this.drawEars(state);
this.drawHair(state);
this.drawBeard(state);
this.drawEyesAndBrows(state);
this.drawMouth(state);
}
drawBody(state) {
const ctx = this.ctx;
const skinHex = skinColorMap[state.skinColor] || DEFAULT_SKIN;
const clothesColorMap = {
blue:   '#4a7fc1',
red:    '#c14a4a',
green:  '#4ac15b',
black:  '#2e2e2e',
yellow: '#c8a84b',
gray:   '#c0c0c0'
};
const clothesHex = clothesColorMap[state.clothesColor] || '#4a7fc1';
const pantsHex = clothesColorMap[state.pantsColor] || clothesHex;
const cx = 200;
const isRound = state.faceShape === 'round';
const headCY = 180;
const headRY = isRound ? 140 : 145;
const neckTop = headCY + headRY - 20;
const neckW = 34;
const neckBottom = neckTop + 42;
const shoulderY = neckBottom;
const bodyBottom = 575;
const bodyHalfW = 85;
const shoulderHalfW = 108;
ctx.fillStyle = skinHex;
ctx.beginPath();
ctx.rect(cx - neckW / 2, neckTop, neckW, neckBottom - neckTop + 2);
ctx.fill();
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(cx - neckW / 2, neckBottom);
ctx.lineTo(cx - neckW / 2, neckTop + 4);
ctx.arc(cx, neckTop + 4, neckW / 2, Math.PI, 0);
ctx.lineTo(cx + neckW / 2, neckBottom);
ctx.stroke();
const armW = 28;
const armTop = shoulderY;
const armBottom = bodyBottom - 20;
const bodyEdgeAtY = (y) => {
const t = (y - shoulderY) / (bodyBottom - shoulderY);
return shoulderHalfW - (shoulderHalfW - bodyHalfW) * t;
};
const drawArm = (side) => {
const s = side;
ctx.fillStyle = clothesHex;
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 2;
ctx.beginPath();
const topInX = cx + s * bodyEdgeAtY(armTop);
const topOutX = cx + s * (bodyEdgeAtY(armTop) + armW);
const botInX = cx + s * (bodyEdgeAtY(armBottom) + 4);
const botOutX = cx + s * (bodyEdgeAtY(armBottom) + armW + 2);
ctx.moveTo(topInX, armTop);
ctx.lineTo(topOutX, armTop + 4);
ctx.lineTo(botOutX, armBottom);
ctx.lineTo(botInX, armBottom);
ctx.closePath();
ctx.fill();
ctx.stroke();
};
drawArm(-1);
drawArm(1);
const botInL = cx - (bodyEdgeAtY(armBottom) + 4);
const botOutL = cx - (bodyEdgeAtY(armBottom) + armW + 2);
const handLX = (botInL + botOutL) / 2;
const botInR = cx + (bodyEdgeAtY(armBottom) + 4);
const botOutR = cx + (bodyEdgeAtY(armBottom) + armW + 2);
const handRX = (botInR + botOutR) / 2;
ctx.fillStyle = skinHex;
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.ellipse(handLX, armBottom + 14, 15, 18, 0, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
ctx.beginPath();
ctx.ellipse(handRX, armBottom + 14, 15, 18, 0, 0, Math.PI * 2);
ctx.fill();
ctx.stroke();
ctx.fillStyle = clothesHex;
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 2.5;
ctx.beginPath();
ctx.moveTo(cx - shoulderHalfW, shoulderY);
ctx.lineTo(cx + shoulderHalfW, shoulderY);
ctx.lineTo(cx + bodyHalfW, bodyBottom);
ctx.lineTo(cx - bodyHalfW, bodyBottom);
ctx.closePath();
ctx.fill();
ctx.stroke();
const darkenHex = this._darken(clothesHex, 0.22);
ctx.lineCap = 'round';
if (state.clothes === 'tshirt') {
const cW = 40;
const cD = 42;
ctx.fillStyle = skinHex;
ctx.beginPath();
ctx.moveTo(cx - cW, shoulderY);
ctx.bezierCurveTo(cx - cW, shoulderY + cD, cx + cW, shoulderY + cD, cx + cW, shoulderY);
ctx.closePath();
ctx.fill();
const neckGrad = ctx.createRadialGradient(cx, shoulderY + cD * 0.6, 2, cx, shoulderY + cD * 0.4, cW);
neckGrad.addColorStop(0, 'rgba(0,0,0,0.15)');
neckGrad.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = neckGrad;
ctx.beginPath();
ctx.moveTo(cx - cW, shoulderY);
ctx.bezierCurveTo(cx - cW, shoulderY + cD, cx + cW, shoulderY + cD, cx + cW, shoulderY);
ctx.closePath();
ctx.fill();
const ribW = 11;
const ribColor = this._darken(clothesHex, 0.13);
ctx.fillStyle = ribColor;
ctx.beginPath();
ctx.moveTo(cx - cW, shoulderY);
ctx.bezierCurveTo(cx - cW, shoulderY + cD, cx + cW, shoulderY + cD, cx + cW, shoulderY);
ctx.lineTo(cx + cW - ribW, shoulderY);
ctx.bezierCurveTo(cx + cW - ribW, shoulderY + cD - ribW * 0.9, cx - cW + ribW, shoulderY + cD - ribW * 0.9, cx - cW + ribW, shoulderY);
ctx.closePath();
ctx.fill();
ctx.strokeStyle = this._darken(clothesHex, 0.32);
ctx.lineWidth = 2;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(cx - cW, shoulderY);
ctx.bezierCurveTo(cx - cW, shoulderY + cD, cx + cW, shoulderY + cD, cx + cW, shoulderY);
ctx.stroke();
ctx.strokeStyle = this._darken(clothesHex, 0.2);
ctx.lineWidth = 1.5;
ctx.beginPath();
ctx.moveTo(cx - cW + ribW, shoulderY);
ctx.bezierCurveTo(cx - cW + ribW, shoulderY + cD - ribW * 0.9, cx + cW - ribW, shoulderY + cD - ribW * 0.9, cx + cW - ribW, shoulderY);
ctx.stroke();
ctx.strokeStyle = 'rgba(0,0,0,0.1)';
ctx.lineWidth = 1;
for (let r = 1; r <= 3; r++) {
const t = r / 4;
const rCW = cW - ribW * t;
const rCD = cD - ribW * 0.9 * t;
ctx.beginPath();
ctx.moveTo(cx - rCW, shoulderY);
ctx.bezierCurveTo(cx - rCW, shoulderY + rCD, cx + rCW, shoulderY + rCD, cx + rCW, shoulderY);
ctx.stroke();
}
ctx.strokeStyle = this._darken(clothesHex, 0.24);
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(cx - shoulderHalfW + 2, shoulderY + 2);
ctx.lineTo(cx - cW + 1, shoulderY + 2);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx + shoulderHalfW - 2, shoulderY + 2);
ctx.lineTo(cx + cW - 1, shoulderY + 2);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx - shoulderHalfW + 1, shoulderY + 2);
ctx.lineTo(cx - shoulderHalfW + 15, shoulderY + 38);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx + shoulderHalfW - 1, shoulderY + 2);
ctx.lineTo(cx + shoulderHalfW - 15, shoulderY + 38);
ctx.stroke();
ctx.strokeStyle = this._darken(clothesHex, 0.16);
ctx.lineWidth = 1.5;
ctx.beginPath();
ctx.moveTo(cx - bodyHalfW + 3, shoulderY + 55);
ctx.lineTo(cx - bodyHalfW + 4, bodyBottom - 1);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx + bodyHalfW - 3, shoulderY + 55);
ctx.lineTo(cx + bodyHalfW - 4, bodyBottom - 1);
ctx.stroke();
ctx.strokeStyle = this._darken(clothesHex, 0.24);
ctx.lineWidth = 3.5;
ctx.beginPath();
ctx.moveTo(cx - bodyHalfW + 3, bodyBottom - 3);
ctx.lineTo(cx + bodyHalfW - 3, bodyBottom - 3);
ctx.stroke();
const bodyGrad = ctx.createLinearGradient(cx - 28, 0, cx + 28, 0);
bodyGrad.addColorStop(0, 'rgba(0,0,0,0)');
bodyGrad.addColorStop(0.5, 'rgba(0,0,0,0.05)');
bodyGrad.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = bodyGrad;
ctx.fillRect(cx - 28, shoulderY + cD + 6, 56, 130);
} else if (state.clothes === 'hoodie') {
ctx.fillStyle = skinHex;
ctx.beginPath();
ctx.moveTo(cx - 20, shoulderY);
ctx.quadraticCurveTo(cx - 20, shoulderY + 24, cx, shoulderY + 22);
ctx.quadraticCurveTo(cx + 20, shoulderY + 24, cx + 20, shoulderY);
ctx.fill();
const hoodScale = 0.7;
const sHW = shoulderHalfW * hoodScale;
ctx.fillStyle = darkenHex;
ctx.beginPath();
ctx.moveTo(cx - sHW, shoulderY);
ctx.lineTo(cx - 20 * hoodScale, shoulderY);
ctx.lineTo(cx - 16 * hoodScale, shoulderY + 38);
ctx.lineTo(cx - 50 * hoodScale, shoulderY + 28);
ctx.lineTo(cx - sHW + 5 * hoodScale, shoulderY + 12);
ctx.closePath();
ctx.fill();
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 1.5;
ctx.stroke();
ctx.fillStyle = darkenHex;
ctx.beginPath();
ctx.moveTo(cx + sHW, shoulderY);
ctx.lineTo(cx + 20 * hoodScale, shoulderY);
ctx.lineTo(cx + 16 * hoodScale, shoulderY + 38);
ctx.lineTo(cx + 50 * hoodScale, shoulderY + 28);
ctx.lineTo(cx + sHW - 5 * hoodScale, shoulderY + 12);
ctx.closePath();
ctx.fill();
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 1.5;
ctx.stroke();
ctx.fillStyle = skinHex;
ctx.beginPath();
ctx.moveTo(cx - 20, shoulderY);
ctx.quadraticCurveTo(cx - 20, shoulderY + 24, cx, shoulderY + 22);
ctx.quadraticCurveTo(cx + 20, shoulderY + 24, cx + 20, shoulderY);
ctx.fill();
ctx.beginPath();
ctx.moveTo(cx - 20, shoulderY);
ctx.quadraticCurveTo(cx - 20, shoulderY + 24, cx, shoulderY + 22);
ctx.quadraticCurveTo(cx + 20, shoulderY + 24, cx + 20, shoulderY);
ctx.strokeStyle = darkenHex;
ctx.lineWidth = 2;
ctx.stroke();
ctx.strokeStyle = this._darken(clothesHex, 0.4);
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(cx, shoulderY + 22);
ctx.lineTo(cx, bodyBottom - 10);
ctx.stroke();
const kpY = shoulderY + 110;
ctx.fillStyle = darkenHex;
ctx.beginPath();
ctx.roundRect(cx - 40, kpY, 80, 44, 12);
ctx.fill();
ctx.strokeStyle = '#4a362a';
ctx.lineWidth = 1.5;
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx, kpY);
ctx.lineTo(cx, kpY + 44);
ctx.stroke();
ctx.strokeStyle = this._darken(clothesHex, 0.45);
ctx.lineWidth = 2.5;
ctx.beginPath();
ctx.moveTo(cx - 9, shoulderY + 18);
ctx.lineTo(cx - 7, shoulderY + 70);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx + 9, shoulderY + 18);
ctx.lineTo(cx + 7, shoulderY + 70);
ctx.stroke();
} else if (state.clothes === 'suit') {
const btnY    = shoulderY + 155;
const btnCX   = cx;
const shirtTopW = 20;
const shirtBotW = 20;
ctx.fillStyle = '#f0ede4';
ctx.beginPath();
ctx.moveTo(cx - shirtTopW, shoulderY);
ctx.lineTo(cx + shirtTopW, shoulderY);
ctx.lineTo(cx + shirtBotW, bodyBottom);
ctx.lineTo(cx - shirtBotW, bodyBottom);
ctx.closePath();
ctx.fill();
ctx.strokeStyle = '#2a1e12';
ctx.lineWidth = 1.8;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(cx - shirtTopW, shoulderY);
ctx.lineTo(cx - shirtTopW, bodyBottom);
ctx.moveTo(cx + shirtTopW, shoulderY);
ctx.lineTo(cx + shirtTopW, bodyBottom);
ctx.moveTo(cx - shirtTopW, shoulderY);
ctx.lineTo(cx + shirtTopW, shoulderY);
ctx.stroke();
ctx.fillStyle = '#f0ede4';

_darken(hex, amount) {
const num = parseInt(hex.replace('#', ''), 16);
const r = Math.max(0, (num >> 16) - Math.round(255 * amount));
const g = Math.max(0, ((num >> 8) & 0xff) - Math.round(255 * amount));
const b = Math.max(0, (num & 0xff) - Math.round(255 * amount));
return `rgb(${r},${g},${b})`;
}
_lighten(colorStr, amount) {
const m = colorStr.match(/\d+/g);
if (!m) return colorStr;
const r = Math.min(255, +m[0] + Math.round(255 * amount));
const g = Math.min(255, +m[1] + Math.round(255 * amount));
const b = Math.min(255, +m[2] + Math.round(255 * amount));
return `rgb(${r},${g},${b})`;
}

ctx.moveTo(bx, by);
ctx.lineTo(bx + (Math.random() - 0.4) * 3, by + h.downLen);
ctx.stroke();
});
ctx.restore();
} else {
ctx.beginPath();
if (type === 'neutral') {
ctx.moveTo(x, startY);
ctx.lineTo(x + 45, endY);
} else if (type === 'arched') {
ctx.moveTo(x, startY);
ctx.quadraticCurveTo(x + 22, Math.min(startY, endY) - 14, x + 45, endY);
} else if (type === 'surprised') {
ctx.moveTo(x + 5, startY - 8);
ctx.quadraticCurveTo(x + 20, Math.min(startY, endY) - 22, x + 40, endY - 8);
}
ctx.strokeStyle = '#2a1e12';
ctx.lineWidth   = 4;
ctx.lineCap     = 'round';
ctx.stroke();
}
}
drawOneEye(ex, ey, eType, skinHex) {
const ctx = this.ctx;
if (eType === 'happy') {
ctx.save();

ctx.ellipse(ex, ey, 22, 18, 0, 0, Math.PI * 2);

ctx.beginPath();
ctx.arc(ex, ey, 9, 0, Math.PI * 2);
ctx.fillStyle = '#1a1008';
ctx.fill();

ctx.fill();
ctx.beginPath();
ctx.moveTo(ex - 23, ey + 2);
ctx.quadraticCurveTo(ex, ey - 20, ex + 23, ey + 2);
ctx.lineTo(ex + 23, ey - 22);
ctx.lineTo(ex - 23, ey - 22);

ctx.fillStyle = skinHex;
ctx.fill();
ctx.beginPath();
ctx.moveTo(ex - 22, ey + 2);
ctx.quadraticCurveTo(ex, ey - 18, ex + 22, ey + 2);

ctx.lineCap     = 'round';
ctx.stroke();
ctx.restore();
} else if (eType === 'angry') {

ctx.fill();
ctx.strokeStyle = '#7c6e5d';

ctx.fillStyle = '#1a1008';
ctx.fill();
ctx.beginPath();
ctx.arc(ex - 3, ey - 3, 3, 0, Math.PI * 2);
ctx.fillStyle = 'white';
ctx.fill();
ctx.beginPath();
ctx.moveTo(ex - 23, ey - 22);
ctx.lineTo(ex + 23, ey - 22);
if (isLeft) {
ctx.lineTo(ex + 23, ey - 4);
ctx.lineTo(ex - 23, ey - 14);
} else {
ctx.lineTo(ex + 23, ey - 14);
ctx.lineTo(ex - 23, ey - 4);
}
ctx.closePath();
ctx.fillStyle = skinHex;
ctx.fill();
ctx.beginPath();

ctx.moveTo(ex - 23, ey - 14);
ctx.lineTo(ex + 23, ey - 4);
} else {
ctx.moveTo(ex - 23, ey - 4);
ctx.lineTo(ex + 23, ey - 14);
}

ctx.lineCap     = 'round';

ctx.fillStyle = '#f9f9f9';
ctx.fill();
ctx.strokeStyle = '#7c6e5d';
ctx.lineWidth   = 1.5;
ctx.stroke();
ctx.beginPath();

ctx.fillStyle = '#362815';
ctx.fill();
ctx.beginPath();

}
}
drawMouth(state) {
const ctx       = this.ctx;
const mouthType = state.mouth;
const cx = 200;
const cy = 260;
const mouthColor     = '#e8a0a8';
const mouthLineWidth = 5;
ctx.lineCap  = 'round';
ctx.lineJoin = 'round';
const strokePath = (drawFn) => {
drawFn();
ctx.strokeStyle = '#3a1a1a';
ctx.lineWidth   = mouthLineWidth + 3;
ctx.stroke();
drawFn();
ctx.strokeStyle = mouthColor;
ctx.lineWidth   = mouthLineWidth;
ctx.stroke();
};
switch (mouthType) {
case 'smile':
strokePath(() => {
ctx.beginPath();
ctx.moveTo(cx - 40, cy - 5);
ctx.quadraticCurveTo(cx, cy + 20, cx + 40, cy - 5);
});
break;
case 'neutral':
strokePath(() => {
ctx.beginPath();
ctx.moveTo(cx - 35, cy);
ctx.lineTo(cx + 35, cy);
});
break;
case 'sad':
strokePath(() => {
ctx.beginPath();
ctx.moveTo(cx - 40, cy + 10);
ctx.quadraticCurveTo(cx, cy - 10, cx + 40, cy + 10);
});
break;
case 'open': {
const openTop = cy - 12;
const openBot = cy + 18;
const midY    = (openTop + openBot) / 2;
const rX      = 36;
const rY      = (openBot - openTop) / 2;
ctx.save();
ctx.beginPath();
ctx.ellipse(cx, midY, rX, rY, 0, 0, Math.PI * 2);
ctx.clip();
ctx.fillStyle = '#3d0e18';
ctx.fillRect(cx - rX, openTop, rX * 2, rY * 2);
ctx.beginPath();
ctx.ellipse(cx + 2, openBot - 5, 16, 10, 0, 0, Math.PI * 2);
ctx.fillStyle = '#c85050';
ctx.fill();
ctx.strokeStyle = '#8b2020';
ctx.lineWidth   = 1.5;
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx + 2, openBot - 14);
ctx.lineTo(cx + 2, openBot + 2);
ctx.strokeStyle = 'rgba(140,30,30,0.5)';
ctx.lineWidth   = 1.5;
ctx.stroke();
ctx.fillStyle = '#f5f0e8';
ctx.fillRect(cx - rX, openTop, rX * 2, rY);
ctx.strokeStyle = 'rgba(150,140,130,0.5)';
ctx.lineWidth   = 1;
for (let i = -3; i <= 3; i++) {
ctx.beginPath();
ctx.moveTo(cx + i * 10, openTop);
ctx.lineTo(cx + i * 10, midY);
ctx.stroke();
}
ctx.restore();
ctx.beginPath();
ctx.ellipse(cx, midY, rX, rY, 0, 0, Math.PI * 2);
ctx.strokeStyle = '#3a1a1a';
ctx.lineWidth   = mouthLineWidth + 3;
ctx.stroke();
ctx.beginPath();
ctx.ellipse(cx, midY, rX, rY, 0, 0, Math.PI * 2);
ctx.strokeStyle = mouthColor;
ctx.lineWidth   = mouthLineWidth;
ctx.stroke();
ctx.beginPath();
ctx.moveTo(cx - rX + 2, midY);
ctx.lineTo(cx + rX - 2, midY);
ctx.strokeStyle = '#3a1a1a';
ctx.lineWidth   = 2;
ctx.stroke();
break;
}
}
}
}
function initializeControls({ setAndRedraw, randomize, canvas }) {
const optionGroups = [
{ selector: '#faceShapeGroup .opt-btn', key: 'faceShape', attr: 'shape' },
{ selector: '#earsGroup .opt-btn', key: 'ears', attr: 'ears' },
{ selector: '#hairGroup .opt-btn', key: 'hair', attr: 'hair' },
{ selector: '#beardGroup .opt-btn', key: 'beard', attr: 'beard' },
{ selector: '#eyesGroup .opt-btn', key: 'eyes', attr: 'eyes' },
{ selector: '#browsGroup .opt-btn', key: 'brows', attr: 'brows' },
{ selector: '#mouthGroup .opt-btn', key: 'mouth', attr: 'mouth' },
{ selector: '#clothesGroup .opt-btn', key: 'clothes', attr: 'clothes' },
{ selector: '#shoesGroup .opt-btn', key: 'shoes', attr: 'shoes' }
];
optionGroups.forEach(group => {
document.querySelectorAll(group.selector).forEach(button => {
button.addEventListener('click', () => {

setAndRedraw({ [group.key]: value });

});

});

console.log('pants color dots count', pantsDots.length);
pantsDots.forEach(dot => {

setAndRedraw({ pantsColor: color });
}
});
});
document.querySelectorAll('#clothesColorGroup .color-dot').forEach(dot => {

function updateSelectedButtons(state) {
